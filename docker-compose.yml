services:
  web:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://logistica:logistica@db:5432/pi_logistica
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-demo-local-only-change-before-public-use}
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "app.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pi_logistica
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistica}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_criacao_e_insercao.sql:/docker-entrypoint-initdb.d/01_criacao_e_insercao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistica -d pi_logistica"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
