services:
  web:
    build: .
    volumes:
      - .:/workspace:cached
    environment:
      DATABASE_URL: postgresql://logistica:logistica@db:5432/pi_logistica
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-codespaces-dev-only-change-me}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: sleep infinity
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pi_logistica
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_criacao_e_insercao.sql:/docker-entrypoint-initdb.d/01_criacao_e_insercao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistica -d pi_logistica"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
