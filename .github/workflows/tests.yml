name: Testes Python
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pi_logistica_test
          POSTGRES_USER: logistica
          POSTGRES_PASSWORD: teste-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistica -d pi_logistica_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://logistica:teste-ci@localhost:5432/pi_logistica_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Iniciar aplicação completa com Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Validar HTTP e banco na aplicação em execução
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          base = "http://127.0.0.1:5000"
          with urlopen(base + "/health", timeout=10) as response:
              assert json.load(response) == {"status": "ok", "database": "connected"}
          for path in ("/", "/clientes", "/motoristas", "/veiculos", "/entregas", "/relatorios"):
              with urlopen(base + path, timeout=10) as response:
                  assert response.status == 200
                  assert b"<!doctype html>" in response.read().lower()
              print(f"OK {path}")
          print("HTTP e PostgreSQL conectados: OK")
          PY
      - name: Logs de diagnóstico em caso de falha
        if: failure()
        run: docker compose logs --tail=100 web db

