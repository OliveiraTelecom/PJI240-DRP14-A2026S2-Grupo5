<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logística Integrada</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f6fa}.navbar{background:#12304b}.card{border:0;box-shadow:0 2px 12px #19354b13;border-radius:14px}.table-responsive{border-radius:10px}h1{font-weight:700}.badge{font-size:.8rem}</style></head><body><nav class="navbar navbar-expand-lg navbar-dark mb-4"><div class="container"><a class="navbar-brand fw-bold" href="{{url_for('dashboard')}}">🚚 Logística Integrada</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto"><a class="nav-link" href="{{url_for('dashboard')}}">Dashboard</a><a class="nav-link" href="{{url_for('records',kind='clientes')}}">Clientes</a><a class="nav-link" href="{{url_for('records',kind='motoristas')}}">Motoristas</a><a class="nav-link" href="{{url_for('records',kind='veiculos')}}">Veículos</a><a class="nav-link" href="{{url_for('entregas')}}">Entregas</a><a class="nav-link" href="{{url_for('relatorios')}}">Relatórios</a></div></div></div></nav><main class="container pb-5">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
